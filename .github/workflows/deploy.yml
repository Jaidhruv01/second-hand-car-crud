name: Deploy Car CRUD to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Show deployed commit
        run: |
          echo "Deploying commit:"
          git rev-parse HEAD
          echo "Frontend files:"
          ls -la frontend/src

      - name: Create deployment package
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            -czf deployment.tar.gz \
            backend frontend docker-compose.yml README.md

      - name: Copy package to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deployment.tar.gz"
          target: "/home/ubuntu"

      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "===== STOPPING OLD APPLICATION ====="

            if [ -d /home/ubuntu/car-crud ]; then
              cd /home/ubuntu/car-crud
              docker compose down || true
            fi

            echo "===== REMOVING OLD SOURCE ====="

            rm -rf /home/ubuntu/car-crud
            mkdir -p /home/ubuntu/car-crud

            echo "===== EXTRACTING NEW SOURCE ====="

            tar -xzf /home/ubuntu/deployment.tar.gz \
              -C /home/ubuntu/car-crud

            rm -f /home/ubuntu/deployment.tar.gz

            cd /home/ubuntu/car-crud

            echo "===== FILES RECEIVED ====="
            ls -la
            ls -la frontend/src

            echo "===== FRESH DOCKER BUILD ====="

            docker compose build --no-cache

            echo "===== STARTING APPLICATION ====="

            docker compose up -d --force-recreate

            echo "===== CONTAINERS ====="

            docker compose ps

            echo "===== DEPLOYMENT COMPLETE ====="